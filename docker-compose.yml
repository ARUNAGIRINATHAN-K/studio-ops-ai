services:
  studioops:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studioops
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
